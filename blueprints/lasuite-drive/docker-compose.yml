#  You must create a Keycloak realm and OIDC client after first start:
#  1. Log into Keycloak admin (https://<keycloak-domain>/admin) with the generated KC_ADMIN_USER/KC_ADMIN_PASSWORD
#  2. Create a realm named drive (or change KEYCLOAK_REALM)
#  3. Create a client with ID drive, set the redirect URI to https://<app-domain>/oidc/callback/
#  4. Set the client secret to match OIDC_CLIENT_SECRET



version: "3.8"

services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 30

  kc-postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=${KC_DB_USER}
      - POSTGRES_PASSWORD=${KC_DB_PASSWORD}
    volumes:
      - kc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d keycloak -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio
    command: minio server --console-address :9001 /data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - 9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 10s
      retries: 30

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      /usr/bin/mc alias set drive http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      /usr/bin/mc mb --ignore-existing drive/drive-media-storage &&
      /usr/bin/mc version enable drive/drive-media-storage &&
      exit 0;"

  ds-proxy:
    image: demarchenumerique/ds-proxy:v2.0.0-alpha.2
    command:
      - proxy
      - --address
      - "0.0.0.0:4444"
      - --password-file
      - /etc/dsproxy/PASSWORD
      - --salt
      - "${DSPROXY_SALT}"
      - --keyring-file
      - /etc/dsproxy/keyring.toml
      - --upstream-url
      - http://minio:9000
      - --local-encryption-directory
      - /var/tmp/local_encryption/
      - --s3-access-key
      - "${MINIO_ROOT_USER}"
      - --s3-secret-key
      - "${MINIO_ROOT_PASSWORD}"
      - --s3-region
      - us-east-1
    volumes:
      - ./dsproxy/PASSWORD:/etc/dsproxy/PASSWORD:ro
      - ./dsproxy/keyring.toml:/etc/dsproxy/keyring.toml:ro
      - dsproxy-tmp:/var/tmp/local_encryption
    depends_on:
      minio:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    command:
      - start
      - --http-enabled=true
      - --proxy-headers=xforwarded
      - --hostname-strict=false
    environment:
      - KEYCLOAK_ADMIN=${KC_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KC_ADMIN_PASSWORD}
      - KC_DB=postgres
      - KC_DB_URL_HOST=kc-postgres
      - KC_DB_URL_DATABASE=keycloak
      - KC_DB_USERNAME=${KC_DB_USER}
      - KC_DB_PASSWORD=${KC_DB_PASSWORD}
      - KC_DB_SCHEMA=public
    ports:
      - 8080
    depends_on:
      kc-postgres:
        condition: service_healthy

  app:
    image: lasuite/drive-backend:main
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn -c /usr/local/etc/gunicorn/drive.py drive.wsgi:application"
    environment:
      - DJANGO_CONFIGURATION=Production
      - DJANGO_SETTINGS_MODULE=drive.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - ALLOWED_HOSTS=${APP_DOMAIN}
      - CSRF_TRUSTED_ORIGINS=https://${APP_DOMAIN}
      - DB_HOST=postgres
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - AWS_S3_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_S3_ENDPOINT_URL=http://ds-proxy:4444/upstream
      - AWS_S3_DOMAIN_REPLACE=https://${APP_DOMAIN}/upstream
      - AWS_S3_BUCKET_NAME=drive-media-storage
      - AWS_S3_REGION_NAME=us-east-1
      - AWS_S3_SIGNATURE_VERSION=s3v4
      - MEDIA_BASE_URL=https://${APP_DOMAIN}
      - STORAGES_STATICFILES_BACKEND=django.contrib.staticfiles.storage.StaticFilesStorage
      - OIDC_OP_JWKS_ENDPOINT=http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      - OIDC_OP_AUTHORIZATION_ENDPOINT=https://${KEYCLOAK_DOMAIN}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/auth
      - OIDC_OP_TOKEN_ENDPOINT=http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
      - OIDC_OP_USER_ENDPOINT=http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/userinfo
      - OIDC_OP_INTROSPECTION_ENDPOINT=http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token/introspect
      - OIDC_RP_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_RP_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_RP_SIGN_ALGO=RS256
      - OIDC_RP_SCOPES=openid email
      - LOGIN_REDIRECT_URL=https://${APP_DOMAIN}
      - LOGIN_REDIRECT_URL_FAILURE=https://${APP_DOMAIN}
      - LOGOUT_REDIRECT_URL=https://${APP_DOMAIN}
      - PYTHONPATH=/app
      - LOGGING_LEVEL_HANDLERS_CONSOLE=INFO
      - AWS_REQUEST_CHECKSUM_CALCULATION=when_required
      - AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
      - S3_TRANSFER_CONFIG_USE_THREADS=False
      - S3_TRANSFER_CONFIG_MULTIPART_THRESHOLD=10737418240
      - S3_TRANSFER_CONFIG_MULTIPART_CHUNKSIZE=10737418240
      - S3_TRANSFER_CONFIG_MAX_CONCURRENCY=1
    ports:
      - 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ds-proxy:
        condition: service_started

  celery:
    image: lasuite/drive-backend:main
    command: ["celery", "-A", "drive.celery_app", "worker", "-l", "INFO"]
    environment:
      - DJANGO_CONFIGURATION=Production
      - DJANGO_SETTINGS_MODULE=drive.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DB_HOST=postgres
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - AWS_S3_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_S3_ENDPOINT_URL=http://ds-proxy:4444/upstream
      - AWS_S3_REGION_NAME=us-east-1
      - AWS_S3_SIGNATURE_VERSION=s3v4
      - AWS_REQUEST_CHECKSUM_CALCULATION=when_required
      - AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
      - S3_TRANSFER_CONFIG_USE_THREADS=False
      - S3_TRANSFER_CONFIG_MULTIPART_THRESHOLD=10737418240
      - S3_TRANSFER_CONFIG_MULTIPART_CHUNKSIZE=10737418240
      - S3_TRANSFER_CONFIG_MAX_CONCURRENCY=1
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ds-proxy:
        condition: service_started

  frontend:
    image: lasuite/drive-frontend:main
    ports:
      - 8080

  proxy:
    image: nginx:1.25-alpine
    command: >
      /bin/sh -c "printf 'server {\n
        listen 80;\n
        client_max_body_size 512m;\n
        location /upstream/ {\n
          proxy_pass http://ds-proxy:4444/upstream/;\n
          proxy_set_header Host $$host;\n
          proxy_set_header X-Real-IP $$remote_addr;\n
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;\n
          proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;\n
          proxy_read_timeout 300;\n
        }\n
        location ~* ^/(api|admin|static|media|auth|wopi|__heartbeat__|__lbheartbeat__)(/|$$) {\n
          proxy_pass http://app:8000;\n
          proxy_set_header Host $$host;\n
          proxy_set_header X-Real-IP $$remote_addr;\n
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;\n
          proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;\n
          proxy_read_timeout 300;\n
        }\n
        location / {\n
          proxy_pass http://frontend:8080;\n
          proxy_set_header Host $$host;\n
          proxy_set_header X-Real-IP $$remote_addr;\n
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;\n
          proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;\n
        }\n
      }\n' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    ports:
      - 80
    depends_on:
      - app
      - frontend
      - ds-proxy

volumes:
  postgres-data:
  kc-postgres-data:
  redis-data:
  minio-data:
  dsproxy-tmp:
