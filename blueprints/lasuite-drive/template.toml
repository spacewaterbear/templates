[variables]
# Domains
APP_DOMAIN = "${domain}"
KEYCLOAK_DOMAIN = "${domain}"
MINIO_DOMAIN = "${domain}"

# Application
KEYCLOAK_REALM = "drive"
OIDC_CLIENT_ID = "drive"
OIDC_CLIENT_SECRET = "${password:32}"
DJANGO_SECRET_KEY = "${password:50}"

# Drive database
POSTGRES_DB = "drive"
POSTGRES_USER = "dinum"
POSTGRES_PASSWORD = "${password:32}"

# Keycloak database
KC_DB_USER = "keycloak"
KC_DB_PASSWORD = "${password:32}"

# Keycloak admin
KC_ADMIN_USER = "admin"
KC_ADMIN_PASSWORD = "${password:24}"

# MinIO
MINIO_ROOT_USER = "drive"
MINIO_ROOT_PASSWORD = "${password:32}"

# ds-proxy (file encryption)
# DSPROXY_SALT must be exactly 32 characters
DSPROXY_SALT = "${password:32}"
# DSPROXY_KEY is the encryption key stored in the keyring
DSPROXY_KEY = "${password:96}"
# DSPROXY_PASSWORD is the password used to authenticate requests to ds-proxy
DSPROXY_PASSWORD = "${password:32}"

[config]

# Main application (frontend + backend via proxy)
[[config.domains]]
serviceName = "proxy"
port = 80
host = "${APP_DOMAIN}"

# Keycloak OIDC provider
[[config.domains]]
serviceName = "keycloak"
port = 8080
host = "${KEYCLOAK_DOMAIN}"

# MinIO console (optional, for storage management)
[[config.domains]]
serviceName = "minio"
port = 9001
host = "${MINIO_DOMAIN}"

[config.env]
# Domains
APP_DOMAIN = "${APP_DOMAIN}"
KEYCLOAK_DOMAIN = "${KEYCLOAK_DOMAIN}"

# Application
KEYCLOAK_REALM = "${KEYCLOAK_REALM}"
OIDC_CLIENT_ID = "${OIDC_CLIENT_ID}"
OIDC_CLIENT_SECRET = "${OIDC_CLIENT_SECRET}"
DJANGO_SECRET_KEY = "${DJANGO_SECRET_KEY}"

# Drive database
POSTGRES_DB = "${POSTGRES_DB}"
POSTGRES_USER = "${POSTGRES_USER}"
POSTGRES_PASSWORD = "${POSTGRES_PASSWORD}"

# Keycloak database
KC_DB_USER = "${KC_DB_USER}"
KC_DB_PASSWORD = "${KC_DB_PASSWORD}"

# Keycloak admin
KC_ADMIN_USER = "${KC_ADMIN_USER}"
KC_ADMIN_PASSWORD = "${KC_ADMIN_PASSWORD}"

# MinIO
MINIO_ROOT_USER = "${MINIO_ROOT_USER}"
MINIO_ROOT_PASSWORD = "${MINIO_ROOT_PASSWORD}"

# ds-proxy
DSPROXY_SALT = "${DSPROXY_SALT}"
DSPROXY_KEY = "${DSPROXY_KEY}"
DSPROXY_PASSWORD = "${DSPROXY_PASSWORD}"

# ds-proxy config files (mounted into the ds-proxy container)
[[config.mounts]]
filePath = "dsproxy/PASSWORD"
content = "${DSPROXY_PASSWORD}"

[[config.mounts]]
filePath = "dsproxy/keyring.toml"
content = """
[keys]
    0 = "${DSPROXY_KEY}"
"""
